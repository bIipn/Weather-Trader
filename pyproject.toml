[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-trader"
version = "0.1.0"
description = "A calibrated weather-forecast trading bot for Kalshi daily temperature markets."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "cryptography>=42",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wxbot = "weather_trader.cli:main"

[tool.setuptools.packages.find]
include = ["weather_trader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
