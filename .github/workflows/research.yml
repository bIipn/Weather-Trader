name: Research (live data)

# Live smoke scan, station calibration and a backtest against real Kalshi prices.
# Runs on demand, weekly (Mondays), and whenever this workflow file changes. Results are
# published to the `research-results` branch.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Backtest window (days)"
        default: "45"
  schedule:
    - cron: "17 9 * * 1"
  push:
    paths:
      - ".github/workflows/research.yml"

permissions:
  contents: read

concurrency:
  group: research
  cancel-in-progress: true

env:
  WXBOT_CONTACT: "github.com/${{ github.repository }}"
  FORCE_COLOR: "1"
  COLUMNS: "140"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e .
      - name: Open markets
        run: wxbot markets
      - name: Model vs market (no trading)
        run: wxbot scan
      - name: Scan as JSON
        run: mkdir -p out && wxbot scan --json > out/scan.json
      - uses: actions/upload-artifact@v4
        with: { name: scan, path: out/ }

  calibrate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:  # split across runners to stay inside Open-Meteo's free hourly quota
        group:
          - "KNYC KMDW KMIA KAUS"
          - "KLAX KDEN KPHL KDFW"
          - "KBOS KSEA KSFO KLAS"
          - "KPHX KATL KDCA KMSP"
          - "KHOU KSAT KOKC KMSY"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e .
      - name: Fit station calibrations (365 days)
        env:
          GROUP: ${{ matrix.group }}
        run: wxbot -v calibrate --kind both --days 365 --station $GROUP
      - uses: actions/upload-artifact@v4
        with:
          name: calibration-${{ strategy.job-index }}
          path: calibration/*.json

  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e .
      - name: Replay strategy on real Kalshi prices
        env:
          DAYS: ${{ github.event.inputs.days || '45' }}
        run: |
          mkdir -p out
          wxbot -v backtest --days "$DAYS" --json > out/backtest.json
          python -c "import json; print(json.dumps(json.load(open('out/backtest.json'))['summary'], indent=1))"
      - name: Replay dead-bracket sniping on 1-minute prices
        env:
          DAYS: ${{ github.event.inputs.days || '45' }}
        run: |
          wxbot -v backtest --strategy sniper --days "$DAYS" --json > out/sniper.json
          python -c "import json; print(json.dumps(json.load(open('out/sniper.json'))['summary'], indent=1))"
      - uses: actions/upload-artifact@v4
        with: { name: backtest, path: out/ }

  publish:
    needs: [scan, calibrate, backtest]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Commit results to the research-results branch
        run: |
          mkdir -p /tmp/results/calibration
          cp artifacts/calibration-*/*.json /tmp/results/calibration/ 2>/dev/null || true
          cp artifacts/scan/*.json artifacts/backtest/*.json /tmp/results/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan research-results
          git rm -rfq .
          cp -r /tmp/results/. .
          echo "Research results from ${GITHUB_SHA::7} on $(date -u +%F)" > README.md
          git add -A
          git commit -qm "Research results ${GITHUB_SHA::7}"
          git push -f origin research-results
